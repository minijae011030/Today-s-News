name: Collect news
run-name: 뉴스 수집 (${{ github.event_name == 'schedule' && '자동' || '수동' }})

on:
  schedule:
    - cron: "37 * * * *" # 매시 37분 (UTC). 정시 근처는 붐벼서 자주 밀려
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      new_count: ${{ steps.count.outputs.new_count }}
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Collect news
        run: npm run collect
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

      - name: Count new stories
        id: count
        run: echo "new_count=$(node -p "try{require('./public/data/meta.json').newCount||0}catch{0}")" >> "$GITHUB_OUTPUT"

      - name: Commit data
        id: commit
        run: |
          # 기사나 오늘의 개념이 바뀌었을 때만 커밋 (수집 시각만 바뀐 건 무시)
          if git diff --quiet -- public/data/news.json public/data/concept.json && \
             [ -z "$(git status --porcelain public/data/concept.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 없음 → 커밋/배포 건너뜀" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add public/data
          git commit -m "$(node scripts/commit-message.mjs)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write

  notify:
    needs: [collect, deploy]
    if: needs.collect.outputs.new_count != '0' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run notify
        env:
          NEW_COUNT: ${{ needs.collect.outputs.new_count }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
